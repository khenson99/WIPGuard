# Railway configuration for the isolated Imladris materialization cron service.
#
# Use this as a separate Railway service config path. It runs the standalone
# worker process instead of calling /api/cron/sync, so crashes/restarts cannot
# take down WIPGuard-app.

[build]
  builder = "dockerfile"
  dockerfilePath = "Dockerfile.imladris-materialization"

[deploy]
  cronSchedule = "5,15,25,35,45,55 * * * *"
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 1
